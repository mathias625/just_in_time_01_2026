<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Just in Time - Login</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="login-body">

    <main class="login-page">

        <section class="login-presentation">

            <div class="presentation-content">

                <div class="presentation-logo">
                    JIT
                </div>

                <h1>
                    Just in Time
                </h1>

                <p class="presentation-subtitle">
                    Gestão inteligente para sua produção.
                </p>


                <div class="presentation-line"></div>


                <div class="presentation-info">

                    <div class="info-item">

                        <span class="info-icon">
                            ◇
                        </span>

                        <span>
                            Controle de produtos
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-icon">
                            ◇
                        </span>

                        <span>
                            Gestão de produção
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-icon">
                            ◇
                        </span>

                        <span>
                            Controle de estoque
                        </span>

                    </div>

                </div>

            </div>

            <div class="presentation-footer">
                Gestão eficiente. Produção inteligente.
            </div>

        </section>

        <section class="login-form-area">

            <div class="login-card">

                <div class="mobile-logo">
                    JIT
                </div>


                <div class="login-title">

                    <span>
                        Acesso
                    </span>

                    <h2>
                        Bem-vindo!
                    </h2>

                    <p>
                        Entre na sua conta para continuar.
                    </p>

                </div>


                <form id="loginForm">


                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                @
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                •
                            </span>

                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite sua senha"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >

                        Entrar

                        <span>
                            →
                        </span>

                    </button>


                    <p
                        id="loginMensagem"
                        class="mensagem"
                    ></p>


                </form>


                <div class="login-footer">

                    <span></span>

                    <p>
                        Sistema de gestão de produção
                    </p>

                    <span></span>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/login.js"></script>

</body>

</html>
